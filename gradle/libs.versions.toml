[versions]
# annotations
jetbrains-annotations = "26.0.2-1"

# networking
netty      = "4.2.7.Final"
netty-util = "0.0.10.Final"

[libraries]
# annotations
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrains-annotations" }

# networking
netty-common                      = { group = "io.netty", name = "netty-common"                      , version.ref = "netty"      }
netty-buffer                      = { group = "io.netty", name = "netty-buffer"                      , version.ref = "netty"      }
netty-codec                       = { group = "io.netty", name = "netty-codec"                       , version.ref = "netty"      }
netty-codec-compression           = { group = "io.netty", name = "netty-codec-compression"           , version.ref = "netty"      }
netty-resolver                    = { group = "io.netty", name = "netty-resolver"                    , version.ref = "netty"      }
netty-util                        = { group = "io.netty", name = "netty-jni-util"                    , version.ref = "netty-util" }
netty-transport                   = { group = "io.netty", name = "netty-transport"                   , version.ref = "netty"      }
netty-transport-classes-epoll     = { group = "io.netty", name = "netty-transport-classes-epoll"     , version.ref = "netty"      }
netty-transport-classes-kqueue    = { group = "io.netty", name = "netty-transport-classes-kqueue"    , version.ref = "netty"      }
netty-transport-classes-io_uring  = { group = "io.netty", name = "netty-transport-classes-io_uring"  , version.ref = "netty"      }
netty-transport-native-common     = { group = "io.netty", name = "netty-transport-native-unix-common", version.ref = "netty"      }
netty-transport-native-epoll      = { group = "io.netty", name = "netty-transport-native-epoll"      , version.ref = "netty"      }
netty-transport-native-kqueue     = { group = "io.netty", name = "netty-transport-native-kqueue"     , version.ref = "netty"      }
netty-transport-native-io_uring   = { group = "io.netty", name = "netty-transport-native-io_uring"   , version.ref = "netty"      }
netty-handler                     = { group = "io.netty", name = "netty-handler"                     , version.ref = "netty"      }

[bundles]
network-all = [
  "netty-common",
  "netty-buffer",
  "netty-codec",
  "netty-codec-compression",
  "netty-resolver",
  "netty-util",
  "netty-transport",
  "netty-transport-classes-epoll",
  "netty-transport-classes-kqueue",
  "netty-transport-classes-io_uring",
  "netty-transport-native-common",
  "netty-transport-native-epoll",
  "netty-transport-native-kqueue",
  "netty-transport-native-io_uring",
  "netty-handler",
]
